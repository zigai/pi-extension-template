repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt --check
        entry: npx oxfmt --check .
        language: system
        pass_filenames: false
        files: "^(src|test)/|.*\\.(ts|js|json|jsonc)$"

      - id: oxlint
        name: oxlint
        entry: npx oxlint -c ./oxlint.config.ts .
        language: system
        pass_filenames: false
        files: "^(src|test)/|.*\\.(ts|js)$"
